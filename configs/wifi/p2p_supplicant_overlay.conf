# P2P configuration for SM8550
update_config=1
device_name=Xiaomi-SM8550
device_type=1-0050F204-1
p2p_go_intent=7
p2p_oper_reg_class=81
p2p_oper_channel=1
p2p_listen_reg_class=81
p2p_listen_channel=1
p2p_go_ht40=1
p2p_go_vht=1
p2p_go_he=1
p2p_disabled=0
p2p_no_group_iface=0
p2p_optimize_listen_chan=1

# Driver parameters
driver_param=use_p2p_group_interface=1
p2p_search_delay=300

# Country code (adjust for your region)
country=US

# Security
p2p_ssid_postfix=Android

# WPS configuration
p2p_go_max_inactivity=300
wps_priority=5

# Additional P2P settings
bss_max_count=400
bss_expiration_age=20
p2p_pref_chan=81:1,81:6,81:11