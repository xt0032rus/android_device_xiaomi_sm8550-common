# WPA supplicant configuration for SM8550
update_config=1
eapol_version=1
ap_scan=1
fast_reauth=1
p2p_disabled=0
driver_param=use_p2p_group_interface=1
p2p_go_intent=3

# Country code
country=US

# Network configuration
bss_max_count=400
bss_expiration_age=20
filter_ssids=1
scan_cur_freq=1

# Interworking
interworking=1
hs20=1
auto_interworking=0

# Disable scan cache explicitly
disable_scan_offload=1
scan_cache_enabled=0

# Power save
pno=1
bss_expiration_scan_count=1

# Security
pmf=1
sae_groups=19 20 21

# WiFi 6/6E support
he=1
wowlan_triggers=any