# WCNSS Configuration for SM8550/QCA6750

# General settings
gEnableImps=1
gEnableBmps=1
gDot11Mode=0
gEnableLog=1

# Power management
gEnableSuspend=1
gEnableDebugLog=0

# Scan settings
gScanResultValidTime=20
gScanResultCachedTime=0  # Disable cached results

# Roaming
gEnableBypassPmkip=1
gEnableGreenAP=1

# Country code
gCountryCodePriority=1
gCountryCode=US

# DFS channel support
gEnableDFSChnlScan=1

# WLAN performance
gEnableAndroidLog=1
gSub20ChannelWidth=1

# STA + SAP concurrency
gStaSafeChannelEnable=1

# Additional SM8550 specific settings
gEnableTdlsD3Sleep=1
gEnableTdlsScan=1
gTdlsPeerKickoutThreshold=96

# Enable 11ax (WiFi 6)
gEnable11ax=1

# Enable 11ac (WiFi 5)
gEnable11ac=1

# MU-MIMO support
gEnableMuMimo=1

# Beamforming
gEnableBeamforming=1

# RSSI monitoring
gRssiMonitor=1
gRssiMonitorThreshold=-80

# Channel bonding
gChannelBondingMode24GHz=1
gChannelBondingMode5GHz=1

# Power save
gEnablePowerSaveOffload=1
gEnableDeepSleep=1

# Thermal mitigation
gThermalMitigationEnabled=1

# Auto channel selection
gEnableAutoChannelSelection=1